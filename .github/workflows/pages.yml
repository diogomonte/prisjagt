name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement: true creates the Pages site via the API. Without it the
      # action 404s ("Get Pages site failed") on a repository where Pages has
      # never been turned on, and someone has to set Settings -> Pages ->
      # Source by hand first. Needs the pages: write permission declared above.
      - uses: actions/configure-pages@v5
        with:
          enablement: true


      # Publish an explicit allowlist. An exclude list would silently publish
      # any directory added later; this cannot.
      # The application is deliberately NOT published: every API call from a
      # public origin is rejected by the browser, so a hosted copy cannot work.
      # The site serves documentation plus the planning artifacts behind it.
      - name: Stage the site
        run: |
          set -euo pipefail
          mkdir -p dist
          cp docs/index.html dist/index.html
          cp -R docs/assets dist/assets
          cp -R vendor dist/vendor
          cp -R openspec dist/openspec
          # The app must not be served - a broken demo is worse than a screenshot.
          if [ -f dist/app.js ]; then
            echo "::error::app.js must not be published."; exit 1
          fi
          # No credential may reach the published output. Match real key
          # material anywhere, but only flag a token assignment in the served
          # page - the published artifacts discuss the variable by name, and
          # prose about a credential is not a credential.
          if grep -rqE 'SG_APIM_[A-Za-z0-9]{8}' dist; then
            echo "::error::API key material reached the staged site."; exit 1
          fi
          if grep -qE 'PRISJAGT_TOKEN *=' dist/index.html; then
            echo "::error::A token assignment reached the published page."; exit 1
          fi
          echo "staged:"; find dist -type f | sort | head -40
          echo "total files: $(find dist -type f | wc -l)"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
